<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Balloya - manuell oppdatering</title>
<script>
(function(){
  try{
    var saved = localStorage.getItem('balloya-theme');
    var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    document.documentElement.setAttribute('data-theme', saved || (prefersDark ? 'dark' : 'light'));
  }catch(e){}
})();
</script>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{ --paper:#EAF0EA; --paper-card:#F8FBF7; --ink:#10241B; --ink-dim:#4B6358; --line:rgba(16,36,27,0.14); --blue:#2748FF; --gold:#E8A83C; --on-gold:#10241B; }
  html[data-theme="dark"]{ --paper:#0C1712; --paper-card:#152420; --ink:#E7EFE9; --ink-dim:#93A89C; --line:rgba(231,239,233,0.16); --blue:#7C93FF; --gold:#F0BC5E; --on-gold:#10241B; }
  html{color-scheme:light;} html[data-theme="dark"]{color-scheme:dark;}
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:'IBM Plex Sans',sans-serif;padding:24px;}
  .wrap{max-width:480px;margin:0 auto;}
  h1{font-family:'Anton',sans-serif;text-transform:uppercase;font-size:28px;margin:0 0 4px;}
  p.sub{color:var(--ink-dim);font-size:14px;margin:0 0 20px;}
  label{display:block;font-size:12px;font-family:'IBM Plex Mono',monospace;text-transform:uppercase;letter-spacing:0.05em;color:var(--ink-dim);margin:16px 0 6px;}
  input, textarea, select{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--paper-card);color:var(--ink);font-family:'IBM Plex Sans',sans-serif;font-size:15px;}
  .row{display:flex;gap:12px;}
  .row > div{flex:1;}
  button{margin-top:22px;width:100%;padding:14px;border:none;border-radius:8px;background:var(--blue);color:#fff;font-family:'IBM Plex Sans',sans-serif;font-weight:600;font-size:15px;cursor:pointer;}
  button.finish{background:var(--gold);color:var(--on-gold);margin-top:10px;}
  .tabs{display:flex;gap:8px;margin:0 0 20px;}
  .tab{
    flex:1;margin-top:0;padding:10px;border-radius:8px;
    background:var(--paper-card);color:var(--ink-dim);
    border:1px solid var(--line);font-size:14px;font-weight:600;cursor:pointer;
  }
  .tab.active{background:var(--blue);color:#fff;border-color:var(--blue);}
  button.remove{background:transparent;color:#B23A2E;border:1px solid #B23A2E;margin-top:10px;}
  #status{margin-top:14px;font-size:14px;padding:10px 12px;border-radius:8px;display:none;}
  #status.ok{display:block;background:rgba(39,72,255,0.1);color:var(--blue);}
  #status.err{display:block;background:rgba(178,58,46,0.1);color:#B23A2E;}
  #manualFields{display:none;}
</style>
</head>
<body>
<div class="wrap">
  <h1>Balloya admin</h1>

  <div class="tabs">
    <button class="tab active" data-panel="scorePanel">Resultater</button>
    <button class="tab" data-panel="newsPanel">Nyheter</button>
  </div>

  <label for="password">Passord</label>
  <input type="password" id="password" autocomplete="current-password">

  <div id="scorePanel">
  <p class="sub">Velg kampen fra listen (hentet fra nettsiden), skriv inn stillingen, og lagre. Sparer API-kall for kampen du er p&aring;.</p>

  <label for="matchPicker">Kamp</label>
  <select id="matchPicker">
    <option value="">Laster kamper...</option>
    <option value="__manual__">Annet (skriv inn selv)</option>
  </select>

  <div id="manualFields">
    <div class="row">
      <div>
        <label for="home">Hjemmelag</label>
        <input type="text" id="home" placeholder="F.eks. Arsenal">
      </div>
      <div>
        <label for="away">Bortelag</label>
        <input type="text" id="away" placeholder="F.eks. Chelsea">
      </div>
    </div>
    <label for="competition">Turnering</label>
    <select id="competition">
      <option value="PL">Premier League</option>
      <option value="FA">FA-cupen</option>
      <option value="EFL">Ligacupen</option>
      <option value="CL">Champions League</option>
      <option value="EL">Europa League</option>
      <option value="CN">Conference League</option>
    </select>
  </div>

  <div class="row">
    <div>
      <label for="homeGoals">Mal hjemme</label>
      <input type="number" id="homeGoals" min="0" value="0">
    </div>
    <div>
      <label for="awayGoals">Mal borte</label>
      <input type="number" id="awayGoals" min="0" value="0">
    </div>
  </div>

  <label for="homeScorers">Malscorere, hjemmelag (ett per linje: navn, minutt)</label>
  <textarea id="homeScorers" rows="3" placeholder="Saka, 34"></textarea>

  <label for="awayScorers">Malscorere, bortelag (ett per linje: navn, minutt)</label>
  <textarea id="awayScorers" rows="3" placeholder="Palmer, 61"></textarea>

  <button id="submitBtn">Lagre og vis som live</button>
  <button id="finishBtn" class="finish">Merk kampen som ferdig</button>
  <button id="removeBtn" class="remove">Fjern manuell oppdatering</button>
  </div>

  <div id="newsPanel" style="display:none;">
    <p class="sub">Nye saker vises p&aring; forsiden i 48 timer, og g&aring;r deretter automatisk i arkivet.</p>

    <label for="newsTag">Kamp / tema (den lille teksten over overskriften)</label>
    <input type="text" id="newsTag" placeholder="F.eks. Arsenal &middot; Chelsea">

    <label for="newsHeadline">Overskrift</label>
    <input type="text" id="newsHeadline" placeholder="F.eks. Sen scoring avgjorde">

    <label for="newsText">Tekst</label>
    <textarea id="newsText" rows="6" placeholder="Litt mer om kampen &hellip;"></textarea>

    <label for="newsDate">Publiseringstidspunkt (la st&aring; tomt for n&aring;)</label>
    <input type="datetime-local" id="newsDate">

    <button id="newsSaveBtn">Publiser sak</button>

    <label for="newsPicker" style="margin-top:26px;">Eksisterende saker</label>
    <select id="newsPicker"><option value="">Laster &hellip;</option></select>
    <button id="newsUpdateBtn" class="finish">Lagre endringer i valgt sak</button>
    <button id="newsDeleteBtn" class="remove">Slett valgt sak</button>
  </div>

  <div id="status"></div>
</div>

<script>
let matches = [];

async function loadMatches() {
  const picker = document.getElementById('matchPicker');
  try {
    const res = await fetch('/api/live-data?v=4');
    const data = await res.json();
    matches = [];
    // results and fixtures already carry every competition, each tagged with its own code.
    (data.results || []).forEach(r => matches.push({
      home: r.home, away: r.away, competition: r.competition || 'PL',
      label: r.home + ' - ' + r.away + ' (' + (r.competition || 'PL') + ')',
    }));
    (data.fixtures || []).forEach(r => matches.push({
      home: r.home, away: r.away, competition: r.competition || 'PL',
      label: r.home + ' - ' + r.away + ' (' + (r.competition || 'PL') + ', kommende)',
    }));
    picker.innerHTML = '<option value="">Velg kamp...</option>' +
      matches.map((m, i) => '<option value="' + i + '">' + m.label + '</option>').join('') +
      '<option value="__manual__">Annet (skriv inn selv)</option>';
  } catch (e) {
    picker.innerHTML = '<option value="__manual__">Kunne ikke laste kamper - skriv inn selv</option>';
    document.getElementById('manualFields').style.display = 'block';
  }
}

document.getElementById('matchPicker').addEventListener('change', (e) => {
  const val = e.target.value;
  const manualFields = document.getElementById('manualFields');
  if (val === '__manual__') {
    manualFields.style.display = 'block';
    document.getElementById('home').value = '';
    document.getElementById('away').value = '';
  } else if (val !== '') {
    manualFields.style.display = 'none';
  }
});

function parseScorers(elementId, team) {
  const raw = document.getElementById(elementId).value.trim();
  if (!raw) return [];
  return raw.split('\n').filter(Boolean).map(line => {
    const parts = line.split(',').map(s => s.trim());
    return { team, name: parts[0] || 'Ukjent', minute: parts[1] || '' };
  });
}

function currentMatch() {
  const val = document.getElementById('matchPicker').value;
  if (val === '__manual__' || val === '') {
    return {
      home: document.getElementById('home').value.trim(),
      away: document.getElementById('away').value.trim(),
      competition: document.getElementById('competition').value,
    };
  }
  return matches[Number(val)];
}

// Keep these in step with COMPETITIONS in netlify/functions/live-data.js.
const COMP_NAMES = {
  PL: 'Premier League',
  FA: 'FA-cupen',
  EFL: 'Ligacupen',
  CL: 'Champions League',
  EL: 'Europa League',
  CN: 'Conference League',
};

async function send(finished) {
  const statusEl = document.getElementById('status');
  statusEl.className = '';
  const m = currentMatch();
  if (!m || !m.home || !m.away) {
    statusEl.textContent = 'Velg en kamp eller fyll inn lagnavn.';
    statusEl.className = 'err';
    return;
  }
  const body = {
    password: document.getElementById('password').value,
    home: m.home,
    away: m.away,
    competition: m.competition,
    competitionName: COMP_NAMES[m.competition] || 'Premier League',
    homeGoals: document.getElementById('homeGoals').value,
    awayGoals: document.getElementById('awayGoals').value,
    scorers: [...parseScorers('homeScorers', 'home'), ...parseScorers('awayScorers', 'away')],
    finished,
  };
  try {
    const res = await fetch('/api/update-score', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Noe gikk galt');
    statusEl.textContent = finished ? 'Kampen er merket som ferdig.' : 'Lagret! Nettsiden viser dette innen ca. ett minutt.';
    statusEl.className = 'ok';
  } catch (e) {
    statusEl.textContent = e.message;
    statusEl.className = 'err';
  }
}

async function removeOverride() {
  const statusEl = document.getElementById('status');
  statusEl.className = '';
  const m = currentMatch();
  if (!m || !m.home || !m.away) {
    statusEl.textContent = 'Velg en kamp f\u00f8rst.';
    statusEl.className = 'err';
    return;
  }
  if (!confirm(`Fjerne manuell oppdatering for ${m.home} - ${m.away}? Kampen g\u00e5r tilbake til automatiske data.`)) return;
  try {
    const res = await fetch('/api/update-score', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        password: document.getElementById('password').value,
        home: m.home, away: m.away, remove: true,
      }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Noe gikk galt');
    statusEl.textContent = data.removed
      ? 'Fjernet. Kampen viser n\u00e5 automatiske data igjen.'
      : 'Fant ingen manuell oppdatering for denne kampen.';
    statusEl.className = 'ok';
  } catch (e) {
    statusEl.textContent = e.message;
    statusEl.className = 'err';
  }
}

// ---------- Tabs ----------
document.querySelectorAll('.tab').forEach(t => {
  t.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(x => x.classList.toggle('active', x === t));
    document.getElementById('scorePanel').style.display = t.dataset.panel === 'scorePanel' ? 'block' : 'none';
    document.getElementById('newsPanel').style.display = t.dataset.panel === 'newsPanel' ? 'block' : 'none';
  });
});

// ---------- Nyheter ----------
let newsCache = [];

function newsStatus(msg, ok) {
  const el = document.getElementById('status');
  el.textContent = msg;
  el.className = ok ? 'ok' : 'err';
}

function toLocalInput(ms) {
  const d = new Date(ms);
  const pad = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

async function loadNewsList() {
  const picker = document.getElementById('newsPicker');
  try {
    const res = await fetch('/api/news');
    const data = await res.json();
    newsCache = data.items || [];
    picker.innerHTML = '<option value="">Velg sak \u2026</option>' +
      newsCache.map(n => {
        const d = new Date(n.publishedAt).toLocaleDateString('no-NO', { day: 'numeric', month: 'short' });
        return `<option value="${n.id}">${d} \u2013 ${n.headline}</option>`;
      }).join('');
  } catch (e) {
    picker.innerHTML = '<option value="">Kunne ikke laste saker</option>';
  }
}

document.getElementById('newsPicker').addEventListener('change', (e) => {
  const item = newsCache.find(n => n.id === e.target.value);
  if (!item) return;
  document.getElementById('newsTag').value = item.tag || '';
  document.getElementById('newsHeadline').value = item.headline || '';
  document.getElementById('newsText').value = item.body || '';
  document.getElementById('newsDate').value = toLocalInput(item.publishedAt);
});

async function newsRequest(payload) {
  const res = await fetch('/api/news', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ password: document.getElementById('password').value, ...payload }),
  });
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || 'Noe gikk galt');
  return data;
}

document.getElementById('newsSaveBtn').addEventListener('click', async () => {
  const dateVal = document.getElementById('newsDate').value;
  try {
    await newsRequest({
      action: 'create',
      tag: document.getElementById('newsTag').value,
      headline: document.getElementById('newsHeadline').value,
      text: document.getElementById('newsText').value,
      publishedAt: dateVal ? new Date(dateVal).toISOString() : null,
    });
    newsStatus('Saken er publisert.', true);
    ['newsTag', 'newsHeadline', 'newsText', 'newsDate'].forEach(id => document.getElementById(id).value = '');
    loadNewsList();
  } catch (e) { newsStatus(e.message, false); }
});

document.getElementById('newsUpdateBtn').addEventListener('click', async () => {
  const id = document.getElementById('newsPicker').value;
  if (!id) return newsStatus('Velg en sak fra listen f\u00f8rst.', false);
  const dateVal = document.getElementById('newsDate').value;
  try {
    await newsRequest({
      action: 'update', id,
      tag: document.getElementById('newsTag').value,
      headline: document.getElementById('newsHeadline').value,
      text: document.getElementById('newsText').value,
      publishedAt: dateVal ? new Date(dateVal).toISOString() : null,
    });
    newsStatus('Endringene er lagret.', true);
    loadNewsList();
  } catch (e) { newsStatus(e.message, false); }
});

document.getElementById('newsDeleteBtn').addEventListener('click', async () => {
  const id = document.getElementById('newsPicker').value;
  if (!id) return newsStatus('Velg en sak fra listen f\u00f8rst.', false);
  const item = newsCache.find(n => n.id === id);
  if (!confirm(`Slette saken "${item ? item.headline : id}"? Dette kan ikke angres.`)) return;
  try {
    await newsRequest({ action: 'delete', id });
    newsStatus('Saken er slettet.', true);
    ['newsTag', 'newsHeadline', 'newsText', 'newsDate'].forEach(x => document.getElementById(x).value = '');
    loadNewsList();
  } catch (e) { newsStatus(e.message, false); }
});

loadNewsList();

document.getElementById('submitBtn').addEventListener('click', () => send(false));
document.getElementById('finishBtn').addEventListener('click', () => send(true));
document.getElementById('removeBtn').addEventListener('click', removeOverride);
loadMatches();
</script>
</body>
</html>
