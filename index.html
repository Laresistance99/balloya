<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Balløya – engelsk fotball på norsk</title>
<meta name="description" content="Tabeller, resultater, kommende kamper og statistikk – din side for alt av engelsk fotball på norsk.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<script>
(function(){
  try{
    var saved = localStorage.getItem('balloya-theme');
    var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    var theme = saved || (prefersDark ? 'dark' : 'light');
    document.documentElement.setAttribute('data-theme', theme);
  }catch(e){}
})();
</script>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#EAF0EA;
    --paper-card:#F8FBF7;
    --ink:#10241B;
    --ink-dim:#4B6358;
    --line: rgba(16,36,27,0.14);
    --blue:#2748FF;
    --blue-dim: rgba(39,72,255,0.10);
    --gold:#E8A83C;
    --red:#B23A2E;
    /* Surfaces that stay dark in both themes (ticker, popups) */
    --panel-bg:#10241B;
    --panel-fg:#EAF0EA;
    --on-gold:#10241B;
    --shadow: rgba(16,36,27,0.22);
    --on-blue:#FFFFFF;
    --maxw: 1120px;
    --radius: 10px;
  }
  html[data-theme="dark"]{
    --paper:#0C1712;
    --paper-card:#152420;
    --ink:#E7EFE9;
    --ink-dim:#93A89C;
    --line: rgba(231,239,233,0.16);
    --blue:#7C93FF;
    --blue-dim: rgba(124,147,255,0.16);
    --gold:#F0BC5E;
    --red:#E8776A;
    --panel-bg:#05100C;
    --panel-fg:#E7EFE9;
    --on-gold:#10241B;
    --shadow: rgba(0,0,0,0.55);
    --on-blue:#0C1712;
  }
  html{color-scheme:light;}
  html[data-theme="dark"]{color-scheme:dark;}
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'IBM Plex Sans', sans-serif;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit;}
  .wrap{max-width:var(--maxw); margin:0 auto; padding:0 24px;}
  .display{font-family:'Anton', sans-serif; font-weight:400; letter-spacing:0.01em; text-transform:uppercase;}
  .mono{font-family:'IBM Plex Mono', monospace;}
  :focus-visible{outline:3px solid var(--blue); outline-offset:2px;}

  /* ---------- Masthead ---------- */
  .masthead{
    border-bottom:1px solid var(--line);
    padding:18px 0;
  }
  .masthead .wrap{display:flex; align-items:baseline; justify-content:space-between; flex-wrap:wrap; gap:8px;}
  .masthead .brand{display:flex; align-items:baseline; gap:10px;}
  .masthead .brand-mark{font-size:22px; letter-spacing:0.04em;}
  .masthead .brand-sub{font-family:'IBM Plex Mono', monospace; font-size:12px; color:var(--blue); background:var(--blue-dim); padding:3px 8px; border-radius:4px; letter-spacing:0.06em;}
  .masthead nav{display:flex; gap:16px; font-size:14px; font-weight:600; flex-wrap:wrap; row-gap:6px;}
  @media (max-width: 480px){
    .masthead nav{gap:10px; font-size:13px;}
    .masthead nav a{white-space:nowrap;}
    #liveStatus{width:100%; order:99;}
  }
  .masthead nav a{text-decoration:none; border-bottom:2px solid transparent; padding-bottom:2px;}
  .masthead nav a:hover{border-bottom-color:var(--blue);}

  /* ---------- Vidiprinter ticker ---------- */
  .theme-toggle{
    display:inline-flex; align-items:center; justify-content:center;
    width:34px; height:34px; padding:0;
    border:1px solid var(--line); border-radius:999px;
    background:var(--paper-card); color:var(--ink-dim);
    cursor:pointer; transition:color .15s ease, border-color .15s ease, background .15s ease;
  }
  .theme-toggle:hover{color:var(--blue); border-color:var(--blue);}
  .theme-toggle .icon-moon{display:none;}
  html[data-theme="dark"] .theme-toggle .icon-sun{display:none;}
  html[data-theme="dark"] .theme-toggle .icon-moon{display:block;}

  .ticker{
    background:var(--panel-bg);
    color:var(--panel-fg);
    overflow:hidden;
    position:relative;
    border-bottom:1px solid var(--line);
  }
  .ticker-label{
    position:absolute; left:0; top:0; bottom:0;
    display:flex; align-items:center;
    padding:0 14px;
    background:var(--gold);
    color:var(--on-gold);
    font-family:'IBM Plex Mono', monospace;
    font-size:11px; font-weight:600; letter-spacing:0.08em;
    z-index:2;
  }
  .ticker-viewport{
    padding:10px 0;
    /* Fallback only: paintTicker() recomputes this from the label’s real width. */
    padding-left:81px;
  }
  .ticker-track{
    display:flex;
    gap:28px;
    width:max-content;
    animation: scroll-ticker 38s linear infinite;
  }
  .ticker-chip{
    font-family:'IBM Plex Mono', monospace;
    font-size:13px;
    font-weight:500;
    white-space:nowrap;
    display:flex; align-items:center; gap:8px;
  }
  .ticker-chip .ft{color:var(--gold); font-size:10px; letter-spacing:0.05em;}
  /* Kick-off time on an upcoming match. The ticker panel is dark in both
     themes, so this cannot use --ink-dim, which is near-black in light mode. */
  .ticker-chip .ko{color:rgba(234,240,234,0.62); font-size:10px; letter-spacing:0.05em;}
  @keyframes scroll-ticker{
    from{ transform: translateX(0); }
    to{ transform: translateX(-50%); }
  }
  @media (prefers-reduced-motion: reduce){
    .ticker-track{ animation:none; }
    .ticker-viewport{ overflow-x:auto; }
  }

  /* ---------- Hero ---------- */
  .hero{padding:56px 0 40px;}
  .hero h1{
    font-size:clamp(38px, 7vw, 68px);
    margin:0 0 14px;
    line-height:0.98;
  }
  .hero p.lede{
    max-width:560px;
    font-size:17px;
    color:var(--ink-dim);
    margin:0 0 32px;
  }
  /* ---------- Today's matches ---------- */
  .today-head{display:flex; align-items:center; gap:12px; margin-bottom:14px; flex-wrap:wrap;}
  .today-tag{
    display:inline-flex; align-items:center; gap:6px;
    background:var(--gold); color:var(--on-gold);
    font-family:'IBM Plex Mono', monospace; font-size:11px; font-weight:600;
    letter-spacing:0.08em; padding:4px 9px; border-radius:4px;
  }
  .today-note{font-family:'IBM Plex Mono', monospace; font-size:12px; color:var(--ink-dim);}
  /* auto-fill keeps two tiles side by side even on a 375px phone */
  .today-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(158px, 1fr)); gap:10px;}
  .tile{
    background:var(--paper-card); border:1px solid var(--line); border-radius:var(--radius);
    padding:11px 13px; display:flex; flex-direction:column; gap:7px;
    transition:border-color .15s ease;
  }
  .tile.is-live{border-color:var(--gold);}
  .tile-top{
    display:flex; align-items:center; justify-content:space-between; gap:8px;
    font-family:'IBM Plex Mono', monospace; font-size:10.5px; letter-spacing:0.05em;
  }
  .tile-when{color:var(--blue); font-weight:600; display:inline-flex; align-items:center; gap:5px;}
  .tile.is-live .tile-when{color:var(--gold);}
  .tile.is-done .tile-when{color:var(--ink-dim);}
  .tile-comp{color:var(--ink-dim); flex:none;}
  .tile-row{display:flex; align-items:center; justify-content:space-between; gap:8px; font-size:13.5px;}
  .tile-team{font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  /* Dim the losing side so a finished result reads at a glance */
  .tile-row.lost .tile-team, .tile-row.lost .tile-score{color:var(--ink-dim); font-weight:500;}
  .tile-score{font-family:'IBM Plex Mono', monospace; font-weight:600; flex:none;}
  .live-dot{
    width:6px; height:6px; border-radius:50%; background:var(--gold); flex:none;
    animation:live-pulse 1.6s ease-in-out infinite;
  }
  @keyframes live-pulse{0%,100%{opacity:1;} 50%{opacity:0.25;}}
  @media (prefers-reduced-motion: reduce){ .live-dot{animation:none;} }
  @media (hover: hover){ .tile:hover{border-color:var(--blue);} }
  /* Two tiles across a phone leaves ~115px for a name. Tightening the type and
     padding gets the longest current club name in without an ellipsis, which
     matters because the title tooltip is unreachable on touch. */
  @media (max-width: 480px){
    .tile{padding:10px 11px;}
    .tile-row{font-size:12.5px;}
  }
  .today-empty{
    color:var(--ink-dim); font-size:14px; background:var(--paper-card);
    border:1px solid var(--line); border-radius:var(--radius); padding:16px 18px;
  }

  .ticker:hover .ticker-track, .ticker:focus-within .ticker-track{ animation-play-state: paused; }
  .ticker-chip{cursor:default;}
  .ticker-chip.has-scorers{cursor:pointer; border-bottom:1px dotted rgba(234,240,234,0.45); padding-bottom:1px;}
  .ticker-chip.has-scorers:hover, .ticker-chip.has-scorers:focus-visible{color:var(--gold);}

  .ticker-pop{
    position:absolute; z-index:60;
    max-width:260px; min-width:170px;
    background:var(--paper-card); color:var(--ink);
    border:1px solid var(--line); border-radius:8px;
    padding:12px 14px; font-size:13px; line-height:1.55;
    box-shadow:0 8px 24px var(--shadow);
    opacity:0; visibility:hidden; transform:translateY(-4px);
    transition:opacity .15s ease, transform .15s ease, visibility .15s;
    pointer-events:none;
  }
  .ticker-pop.show{opacity:1; visibility:visible; transform:translateY(0);}
  .ticker-pop .pop-match{font-family:'Anton',sans-serif; font-size:15px; margin-bottom:8px;}
  .ticker-pop .pop-side{font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:0.05em; text-transform:uppercase; color:var(--blue); margin-bottom:2px;}
  .ticker-pop .pop-group + .pop-group{margin-top:9px;}
  .ticker-pop .pop-none{color:var(--ink-dim);}

  .result-card{position:relative;}
  .result-card.has-scorers{cursor:pointer;}
  .scorer-pop{
    position:absolute; left:12px; right:12px; top:100%;
    margin-top:6px; z-index:40;
    background:var(--panel-bg); color:var(--panel-fg);
    border-radius:8px; padding:12px 14px;
    font-size:13px; line-height:1.55;
    box-shadow:0 6px 20px var(--shadow);
    opacity:0; visibility:hidden;
    transform:translateY(-4px);
    transition:opacity .16s ease, transform .16s ease, visibility .16s;
  }
  .result-card.open .scorer-pop{opacity:1; visibility:visible; transform:translateY(0);}
  @media (hover: hover){
    .result-card.has-scorers:hover .scorer-pop{opacity:1; visibility:visible; transform:translateY(0);}
  }
  .scorer-pop .pop-side{font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:0.05em; text-transform:uppercase; color:var(--gold); margin-bottom:2px;}
  .scorer-pop .pop-group + .pop-group{margin-top:9px;}
  .scorer-pop .pop-none{color:rgba(234,240,234,0.6);}
  .tap-hint{font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:0.05em; color:var(--blue); margin-top:8px; text-transform:uppercase;}
  @media (hover: hover){ .tap-hint{display:none;} }

  .filter-bar{
    display:flex; gap:8px; margin-bottom:26px;
    overflow-x:auto; -webkit-overflow-scrolling:touch;
    padding-bottom:4px; scrollbar-width:none;
  }
  .filter-bar::-webkit-scrollbar{display:none;}
  .filter-pill{
    flex:0 0 auto;
    font-family:'IBM Plex Sans',sans-serif; font-size:13.5px; font-weight:600;
    padding:8px 15px; border-radius:999px; cursor:pointer;
    background:var(--paper-card); color:var(--ink-dim);
    border:1px solid var(--line);
    transition:background .15s ease, color .15s ease, border-color .15s ease;
    white-space:nowrap;
  }
  .filter-pill:hover{border-color:var(--blue); color:var(--blue);}
  .filter-pill.active{background:var(--blue); color:var(--on-blue); border-color:var(--blue);}
  .filter-pill .count{opacity:0.65; margin-left:5px; font-family:'IBM Plex Mono',monospace; font-size:11px;}
  .sub-bar{margin-top:-14px; margin-bottom:22px;}
  .sub-bar .filter-pill{font-size:12.5px; padding:6px 13px; background:transparent;}
  .sub-bar .filter-pill.active{background:var(--ink); border-color:var(--ink); color:var(--paper);}
  .sub-head{
    font-size:15px; letter-spacing:0.06em; color:var(--ink-dim);
    margin:0 0 12px; text-transform:uppercase;
  }
  .more-btn{
    display:block; width:100%; margin:0 0 26px;
    padding:11px 16px; border:1px solid var(--line); border-radius:8px;
    background:var(--paper-card); color:var(--blue);
    font-family:'IBM Plex Sans',sans-serif; font-size:13.5px; font-weight:600;
    cursor:pointer; transition:border-color .15s ease;
  }
  .more-btn:hover{border-color:var(--blue);}
  .empty-note{color:var(--ink-dim); font-size:14px; padding:14px 2px;}

  /* ---------- Section shell ---------- */
  section{padding:52px 0;}
  section + section{border-top:1px solid var(--line);}
  .section-head{display:flex; align-items:baseline; justify-content:space-between; gap:12px; margin-bottom:26px; flex-wrap:wrap;}
  .section-head h2{font-size:clamp(26px,4vw,36px); margin:0;}
  .section-head .note{color:var(--ink-dim); font-size:13px; font-family:'IBM Plex Mono', monospace;}

  /* ---------- Table ---------- */
  .table-scroll{overflow-x:auto; border:1px solid var(--line); border-radius:var(--radius); background:var(--paper-card);}
  table{width:100%; border-collapse:collapse; min-width:660px;}
  thead th{
    text-align:left; font-family:'IBM Plex Mono', monospace; font-size:11px;
    text-transform:uppercase; letter-spacing:0.06em; color:var(--ink-dim);
    padding:12px 14px; border-bottom:1px solid var(--line);
  }
  thead th.num, td.num{text-align:center;}
  tbody td{padding:11px 14px; border-bottom:1px solid var(--line); font-size:14px;}
  tbody tr:last-child td{border-bottom:none;}
  td.pos{font-family:'Anton', sans-serif; font-size:16px; width:32px; position:relative; padding-left:18px;}
  td.pos::before{content:""; position:absolute; left:0; top:2px; bottom:2px; width:4px; border-radius:2px;}
  tr.top4 td.pos::before{background:var(--blue);}
  tr.releg td.pos::before{background:var(--red);}
  tr.playoff td.pos::before{background:var(--gold);}
  .table-block + .table-block{margin-top:34px;}
  /* Collapsed shows the top five. Toggling is a class flip on the block, so the
     60s refresh cannot fight whichever state the reader chose. */
  .table-block:not(.is-open) tbody tr:nth-child(n+6){display:none;}
  .table-block .more-btn{margin:12px 0 0;}
  td.team{font-weight:600;}
  td.pts{font-family:'IBM Plex Mono', monospace; font-weight:600;}
  /* On a phone the full table is 660px inside a ~325px column, which pushes
     Poeng — the column people actually come for — off screen behind a
     sideways scroll. Drop the four columns you can read off the others. */
  @media (max-width: 640px){
    th.opt, td.opt{display:none;}
    table{min-width:0;}
    thead th, tbody td{padding-left:10px; padding-right:10px;}
  }
  .legend{display:flex; gap:18px; margin-top:14px; font-size:12px; color:var(--ink-dim); flex-wrap:wrap;}
  .legend span{display:inline-flex; align-items:center; gap:6px;}
  .legend i{width:10px; height:10px; border-radius:2px; display:inline-block;}

  /* ---------- Cards grid (results) ---------- */
  .grid{display:grid; gap:14px;}
  .grid.cols-3{grid-template-columns:repeat(3, 1fr);}
  .grid.cols-2{grid-template-columns:repeat(2, 1fr);}
  @media (max-width: 860px){
    .grid.cols-3{grid-template-columns:1fr 1fr;}
  }
  @media (max-width: 640px){
    .grid.cols-3, .grid.cols-2{grid-template-columns:1fr;}
  }

  .result-card{
    background:var(--paper-card); border:1px solid var(--line); border-radius:var(--radius);
    padding:16px 18px;
  }
  .result-card .date{font-family:'IBM Plex Mono', monospace; font-size:11px; color:var(--ink-dim); text-transform:uppercase; letter-spacing:0.05em; margin-bottom:10px;}
  .result-row{display:flex; align-items:center; justify-content:space-between; gap:10px;}
  .result-row .side{font-size:14px; font-weight:600; flex:1;}
  .result-row .side.away{text-align:right;}
  .result-row .score{font-family:'Anton', sans-serif; font-size:22px; color:var(--blue); white-space:nowrap; padding:0 8px;}

  .fixture-list{border:1px solid var(--line); border-radius:var(--radius); background:var(--paper-card); overflow:hidden;}
  /* ---------- Round navigator ---------- */
  .round-nav{
    display:flex; align-items:center; gap:14px; margin:0 0 18px;
    background:var(--paper-card); border:1px solid var(--line);
    border-radius:var(--radius); padding:12px 14px;
  }
  .round-title{flex:1; text-align:center; min-width:0;}
  .round-name{font-size:19px; line-height:1.15;}
  .round-dates{font-family:'IBM Plex Mono',monospace; font-size:11.5px; color:var(--ink-dim); margin-top:3px;}
  .round-arrow{
    flex:none; width:38px; height:38px; padding:0;
    border:1px solid var(--line); border-radius:8px;
    background:var(--paper); color:var(--blue);
    font-size:20px; line-height:1; cursor:pointer;
    transition:border-color .15s ease, color .15s ease;
  }
  .round-arrow:hover:not(:disabled){border-color:var(--blue);}
  .round-arrow:disabled{color:var(--ink-dim); opacity:0.4; cursor:default;}

  .round-day + .round-day{margin-top:22px;}
  .round-day-label{
    font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:0.08em;
    text-transform:uppercase; color:var(--ink-dim);
    margin:0 0 8px; padding-bottom:6px; border-bottom:1px solid var(--line);
  }
  .match-row{
    position:relative;
    display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:12px;
    background:var(--paper-card); border:1px solid var(--line); border-radius:var(--radius);
    padding:12px 14px;
  }
  .match-row + .match-row{margin-top:8px;}
  .match-row.has-scorers{cursor:pointer;}
  .match-row.open .scorer-pop{opacity:1; visibility:visible; transform:translateY(0);}
  @media (hover: hover){
    .match-row.has-scorers:hover .scorer-pop{opacity:1; visibility:visible; transform:translateY(0);}
  }
  .match-side{font-weight:600; font-size:14.5px; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .match-side.away{text-align:right;}
  .match-mid{
    flex:none; text-align:center; min-width:62px;
    font-family:'IBM Plex Mono',monospace; font-weight:600; font-size:15px;
  }
  .match-mid.upcoming{color:var(--blue); font-size:13.5px;}
  .match-tag{
    display:block; font-size:9.5px; letter-spacing:0.06em; font-weight:600;
    color:var(--ink-dim); margin-top:2px;
  }
  .match-tag.live{color:var(--gold);}
  /* A cup or European round can mix competitions, so each row says which */
  .match-comp{
    grid-column:1 / -1; font-family:'IBM Plex Mono',monospace;
    font-size:10px; letter-spacing:0.05em; color:var(--ink-dim); margin-bottom:2px;
  }
  @media (max-width: 480px){
    .match-row{padding:11px 12px; gap:8px;}
    .match-side{font-size:13px;}
    .match-mid{min-width:54px; font-size:14px;}
    .round-name{font-size:17px;}
  }

  .fixture-row{display:flex; align-items:center; gap:16px; padding:14px 18px;}
  .fixture-row + .fixture-row{border-top:1px solid var(--line);}
  .fixture-time{
    font-family:'IBM Plex Mono', monospace; font-size:12px; font-weight:600;
    background:var(--blue-dim); color:var(--blue); padding:5px 9px; border-radius:4px;
    white-space:nowrap; min-width:118px; text-align:center;
  }
  .fixture-teams{font-weight:600; font-size:15px;}

  footer{padding:36px 0 60px; color:var(--ink-dim); font-size:12.5px;}
  footer .wrap{display:flex; justify-content:space-between; gap:14px; flex-wrap:wrap; border-top:1px solid var(--line); padding-top:22px;}
</style>
</head>
<body>

<header class="masthead">
  <div class="wrap">
    <div class="brand">
      <span class="display brand-mark">Balløya</span>
    </div>
    <nav>
      <a href="#tabell">Tabell</a>
      <a href="#kamper">Kamper</a>
      <button id="themeToggle" class="theme-toggle" aria-label="Bytt mellom lys og mørk modus" title="Bytt visning">
        <svg class="icon-sun" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <circle cx="12" cy="12" r="4.2"/>
          <path d="M12 2.5v2.2M12 19.3v2.2M4.2 4.2l1.6 1.6M18.2 18.2l1.6 1.6M2.5 12h2.2M19.3 12h2.2M4.2 19.8l1.6-1.6M18.2 5.8l1.6-1.6"/>
        </svg>
        <svg class="icon-moon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20.5 14.2A8.6 8.6 0 0 1 9.8 3.5a8.6 8.6 0 1 0 10.7 10.7z"/>
        </svg>
      </button>
      <span id="liveStatus" class="mono" style="font-size:11px;color:var(--ink-dim);"></span>
    </nav>
  </div>
</header>

<div class="ticker" aria-label="Siste resultater og dagens kamper">
  <div class="ticker-label" id="tickerLabel">SISTE</div>
  <div class="ticker-viewport">
    <div class="ticker-track" id="tickerTrack"></div>
    
  </div>
</div>
<div id="tickerPop" class="ticker-pop" role="tooltip" aria-hidden="true"></div>

<main>
  <section class="hero">
    <div class="wrap">
      <h1 class="display">Alt fra<br>Balløya</h1>
      <p class="lede">Tabeller, resultater, kommende kamper og statistikk – Din side for alt av engelsk fotball på norsk.</p>

      <div class="today">
        <div class="today-head">
          <span class="today-tag" id="todayTag">I DAG</span>
          <span class="today-note" id="todayNote">Laster …</span>

        <div class="today-grid" id="todayGrid"></div>

    </div>

  <section id="tabell">
    <div class="wrap">
      <div class="section-head">
        <h2 class="display">Tabellen</h2>
      </div>

    </div>
  </section>

  <section id="kamper">
    <div class="wrap">

        <h2 class="display">Kamper</h2>

      <div class="filter-bar" role="tablist" aria-label="Filtrer turnering">
        <button class="filter-pill active" role="tab" aria-selected="true" data-filter="liga">Premier League</button>
        <button class="filter-pill" role="tab" aria-selected="false" data-filter="cup">Engelske cuper</button>
        <button class="filter-pill" role="tab" aria-selected="false" data-filter="europa">Europa</button>

        <button class="round-arrow" id="roundPrev" aria-label="Forrige runde">‹</button>
        <div class="round-title">
          <div class="round-name display" id="roundName"></div>
          <div class="round-dates" id="roundDates"></div>
        </div>

<footer>
  <div class="wrap">
    <span>Uoffisiell fansside – ikke tilknyttet Premier League.</span>
    <span>Laget for norske Premier League-fans.</span>
  </div>
</footer>

<script>
  // ---------- Live data rendering ----------
  // Ticker abbreviations. Keys are normalised names (lower case, no punctuation),
  // with the variants the feed is known to use listed alongside each other —
  // "Newcastle" and "Newcastle United" both have to resolve to NEW.
  //
  // Only ambiguous or non-obvious clubs strictly need an entry; everything else
  // falls through to the rule in tickerAbbr(). The English cups are pulled in
  // whole, so lower-league clubs turn up in here too.
  const TEAM_ABBR = {
    'arsenal': 'ARS',
    'aston villa': 'AVL',
    'bournemouth': 'BOU',
    'brentford': 'BRE',
    'brighton': 'BHA', 'brighton hove albion': 'BHA',
    'burnley': 'BUR',
    'chelsea': 'CHE',
    'coventry': 'COV', 'coventry city': 'COV',
    'crystal palace': 'CRY',
    'everton': 'EVE',
    'fulham': 'FUL',
    'hull': 'HUL', 'hull city': 'HUL',
    'ipswich': 'IPS', 'ipswich town': 'IPS',
    'leeds': 'LEE', 'leeds united': 'LEE',
    'liverpool': 'LIV',
    'manchester city': 'MCI', 'man city': 'MCI',
    'manchester united': 'MUN', 'man united': 'MUN', 'manchester utd': 'MUN',
    'newcastle': 'NEW', 'newcastle united': 'NEW',
    'nottingham forest': 'NFO', 'nottm forest': 'NFO',
    'sunderland': 'SUN',
    'tottenham': 'TOT', 'tottenham hotspur': 'TOT', 'spurs': 'TOT',
    'west ham': 'WHU', 'west ham united': 'WHU',
    'wolves': 'WOL', 'wolverhampton wanderers': 'WOL',
    // Clubs outside the current top flight, reachable through the cups
    'birmingham': 'BIR', 'blackburn': 'BLA', 'bristol city': 'BRC',
    'cardiff': 'CAR', 'charlton': 'CHA', 'derby': 'DER', 'derby county': 'DER',
    'leicester': 'LEI', 'luton': 'LUT', 'middlesbrough': 'MID',
    'millwall': 'MIL', 'norwich': 'NOR', 'oxford united': 'OXF',
    'plymouth': 'PLY', 'portsmouth': 'POR', 'preston': 'PNE',
    'qpr': 'QPR', 'queens park rangers': 'QPR',
    'sheffield united': 'SHU', 'sheffield utd': 'SHU',
    'sheffield wednesday': 'SHW',
    'southampton': 'SOU', 'stoke': 'STK', 'stoke city': 'STK',
    'swansea': 'SWA', 'watford': 'WAT',
    'west bromwich albion': 'WBA', 'west brom': 'WBA',
    'wrexham': 'WRE',
  };

  function fmtDate(iso) {
    const d = new Date(iso);
    const days = ['søn','man','tir','ons','tor','fre','lør'];
    return `${days[d.getDay()]}. ${d.getDate()}. ${d.toLocaleString('no-NO',{month:'short'})}`;
  }
  function fmtTime(iso) {
    const d = new Date(iso);
    return d.toLocaleTimeString('no-NO', { hour: '2-digit', minute: '2-digit' });
  }

  // Each table shows the top five and hides the rest behind a toggle. The zones
  // differ per league: the Championship promotes two automatically and sends
  // four more to a play-off, which one top block cannot express.
  const TABLE_PREVIEW = 5;
  const TABLE_SPECS = [
    {
      key: 'PL', name: 'Premier League',
      rows: d => d.standings || [],
      zones: [{ upto: 4, cls: 'top4', label: 'Mesterligaplass', color: 'var(--blue)' }],
      relegation: { count: 3, label: 'Nedrykksplass' },
    },
    {
      key: 'ELC', name: 'Championship',
      rows: d => (d.tables && d.tables.ELC && d.tables.ELC.rows) || [],
      zones: [
        { upto: 2, cls: 'top4', label: 'Direkte opprykk', color: 'var(--blue)' },
        { upto: 6, cls: 'playoff', label: 'Playoff om opprykk', color: 'var(--gold)' },
      ],
      relegation: { count: 3, label: 'Nedrykksplass' },
    },
  ];

  // Survives the 60s refresh, so an expanded table does not snap shut.
  const tableOpen = {};

  function standingRowHtml(s, i, total, spec) {
    let cls = '';
    for (const z of spec.zones) { if (i < z.upto) { cls = z.cls; break; } }
    if (!cls && i >= total - spec.relegation.count) cls = 'releg';
    const gf = s.goalsFor ?? 0, ga = s.goalsAgainst ?? 0;
    const gd = s.goalDiff ?? (gf - ga);
    const gdTxt = gd > 0 ? '+' + gd : String(gd);
    const gdColor = gd > 0 ? 'var(--blue)' : (gd < 0 ? 'var(--red)' : 'var(--ink-dim)');

    return `<tr class="${cls}"><td class="pos">${s.rank}</td><td class="team">${esc(s.team)}</td>` +
      `<td class="num">${s.played}</td><td class="num opt">${s.win}</td>` +
      `<td class="num opt">${s.draw}</td><td class="num opt">${s.lose}</td>` +
      `<td class="num mono opt">${gf}–${ga}</td>` +
      `<td class="num mono" style="color:${gdColor}">${gdTxt}</td>` +
      `<td class="num pts">${s.points}</td></tr>`;
  }

  function tableBlockHtml(spec, rows) {
    const open = !!tableOpen[spec.key];
    const legend = spec.zones.map(z => `<span><i style="background:${z.color}"></i> ${z.label}</span>`).join('')
      + `<span><i style="background:var(--red)"></i> ${spec.relegation.label}</span>`;

    return `<div class="table-block${open ? ' is-open' : ''}" data-table="${spec.key}">
      <h3 class="sub-head display">${esc(spec.name)}</h3>
      <div class="table-scroll">
        <table>
          <thead><tr>
            <th>#</th><th>Lag</th>
            <th class="num">K</th><th class="num opt">S</th><th class="num opt">U</th><th class="num opt">T</th>
            <th class="num opt">Mål</th><th class="num">+/-</th><th class="num">Poeng</th>
          </tr></thead>
          <tbody>${rows.map((s, i) => standingRowHtml(s, i, rows.length, spec)).join('')}</tbody>
        </table>
      </div>
      ${rows.length > TABLE_PREVIEW
        ? `<button class="more-btn table-toggle" aria-expanded="${open}">${open ? 'Vis topp 5' : 'Vis hele tabellen'}</button>`
        : ''}
      <div class="legend">${legend}</div>
    </div>`;
  }

  function renderTables(data) {
    const host = document.getElementById('tables');
    if (!host) return;

    // A league with no rows is left out rather than rendered as an empty shell.
    const blocks = TABLE_SPECS
      .map(spec => ({ spec, rows: spec.rows(data) }))
      .filter(t => t.rows.length)
      .map(t => tableBlockHtml(t.spec, t.rows));

    host.innerHTML = blocks.length
      ? blocks.join('')
      : '<div class="empty-note">Tabellen er ikke tilgjengelig akkurat nå.</div>';

    host.querySelectorAll('.table-toggle').forEach(btn => {
      btn.addEventListener('click', () => {
        const block = btn.closest('.table-block');
        const open = !block.classList.contains('is-open');
        block.classList.toggle('is-open', open);
        tableOpen[block.dataset.table] = open;
        btn.setAttribute('aria-expanded', String(open));
        btn.textContent = open ? 'Vis topp 5' : 'Vis hele tabellen';
      });
    });
  }

  function scorerPopHtml(r) {
    const mk = (side, label) => {
      const list = (r.scorers || []).filter(s => s.team === side);
      const body = list.length
        ? list.map(s => `${s.name}${s.minute ? " " + s.minute + "'" : ''}`).join('<br>')
        : '<span class="pop-none">Ingen mål</span>';
      return `<div class="pop-group"><div class="pop-side">${label}</div>${body}</div>`;
    };
    return `<div class="scorer-pop">${mk('home', r.home)}${mk('away', r.away)}</div>`;
  }

  function wireScorerPopups(container) {
    container.querySelectorAll('.has-scorers').forEach(card => {
      card.addEventListener('click', (e) => {
        const wasOpen = card.classList.contains('open');
        container.querySelectorAll('.has-scorers.open').forEach(c => c.classList.remove('open'));
        if (!wasOpen) card.classList.add('open');
        e.stopPropagation();
      });
      card.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); card.click(); }
        if (e.key === 'Escape') card.classList.remove('open');
      });
    });
  }

  document.addEventListener('click', () => {
    document.querySelectorAll('.has-scorers.open').forEach(c => c.classList.remove('open'));
  });

  let tickerData = [];
  let lastTicker = null;
  let lastPaintKey = '';

  // The ticker deliberately shows a narrow slice: matches that finished within
  // the last 24 hours, whatever is in play, and today's remaining kick-offs.
  const RESULT_TTL_MS = 24 * 60 * 60 * 1000;
  // The feed carries kick-off time, not full time, so full time is estimated.
  // Matches decided in extra time run ~30 min longer and age out that much early.
  const MATCH_LENGTH_MS = 2 * 60 * 60 * 1000;
  const TICKER_SPEED = 55; // px per second, held constant whatever the chip count

  const LIVE_STATUSES = ['1H', 'HT', '2H', 'ET', 'P', 'LIVE', 'BT'];
  function tickerIsLive(status) {
    return LIVE_STATUSES.includes(status);
  }

  function isToday(iso) {
    const d = new Date(iso), n = new Date();
    return d.getFullYear() === n.getFullYear() && d.getMonth() === n.getMonth() && d.getDate() === n.getDate();
  }

  function tickerEntries(results, fixtures) {
    const now = Date.now();
    const live = [], recent = [];

    (results || []).forEach(r => {
      if (tickerIsLive(r.status)) { live.push(r); return; }
      const endedAt = new Date(r.date).getTime() + MATCH_LENGTH_MS;
      if (now - endedAt < RESULT_TTL_MS) recent.push(r);
    });

    live.sort((a, b) => new Date(a.date) - new Date(b.date));
    recent.sort((a, b) => new Date(b.date) - new Date(a.date));
    const today = (fixtures || [])
      .filter(f => isToday(f.date))
      .sort((a, b) => new Date(a.date) - new Date(b.date));

    return [
      ...live.map(r => ({ r, kind: 'live' })),
      ...recent.map(r => ({ r, kind: 'result' })),
      ...today.map(r => ({ r, kind: 'upcoming' })),
    ];
  }

  // Strip case, accents, punctuation and a bare FC/AFC so feed spellings match.
  function normaliseClub(name) {
    return (name || '')
      .toLowerCase()
      .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
      // Apostrophes close up rather than split, so "Nott'm" stays one word.
      .replace(/['\u2019]/g, '')
      .replace(/[^a-z0-9\s]/g, ' ')
      .replace(/\b(a?fc)\b/g, ' ')
      .replace(/\s+/g, ' ')
      .trim();
  }

  // Generic tails carry no identity: dropping them turns "Coventry City" into
  // COV rather than COV's neighbour, and keeps unmapped clubs sensible.
  const CLUB_TAIL = /\s+(city|united|utd|town|county|wanderers|albion|rovers|athletic|hotspur)$/;

  function tickerAbbr(name) {
    const key = normaliseClub(name);
    if (TEAM_ABBR[key]) return TEAM_ABBR[key];

    let base = key;
    while (CLUB_TAIL.test(base)) base = base.replace(CLUB_TAIL, '');
    if (TEAM_ABBR[base]) return TEAM_ABBR[base];

    return (base || key || '').slice(0, 3).toUpperCase();
  }

  function tickerChip(entry, i) {
    const { r, kind } = entry;
    const hasScorers = (r.scorers || []).length > 0;
    const cls = 'ticker-chip' + (hasScorers ? ' has-scorers' : '');
    const attrs = hasScorers ? ` data-idx="${i}" tabindex="0"` : '';
    if (kind === 'upcoming') {
      return `<span class="${cls}"${attrs}><span class="ko">${fmtTime(r.date)}</span> ${tickerAbbr(r.home)}–${tickerAbbr(r.away)}</span>`;
    }
    const tag = kind === 'live'
      ? '<span class="ft" style="color:var(--gold)">LIVE</span>'
      : '<span class="ft">FT</span>';
    return `<span class="${cls}"${attrs}>${tag} ${tickerAbbr(r.home)} ${r.homeGoals}–${r.awayGoals} ${tickerAbbr(r.away)}</span>`;
  }

  function paintTicker(entries) {
    const track = document.getElementById('tickerTrack');
    if (!track) return;
    const bar = track.closest('.ticker');

    // Nothing within the window: hide the bar rather than leave it empty.
    if (!entries.length) {
      track.innerHTML = '';
      lastPaintKey = '';
      if (bar) bar.style.display = 'none';
      return;
    }
    if (bar) bar.style.display = '';

    tickerData = entries.map(e => e.r);
    const chips = entries.map(tickerChip);
    const hide = (c) => c.replace('<span class="ticker-chip', '<span aria-hidden="true" class="ticker-chip');

    // The label is absolutely positioned, so the viewport's left padding has to
    // clear it by hand. Hardcoding it left a 55px hole: the label is 65px wide
    // on every viewport, since its text never changes.
    const viewportEl = track.parentElement;
    const label = bar ? bar.querySelector('.ticker-label') : null;
    if (viewportEl && label) viewportEl.style.paddingLeft = (label.offsetWidth + 16) + 'px';

    const viewport = viewportEl ? viewportEl.clientWidth : window.innerWidth;

    // Refreshing every 60s used to rebuild the track even when the matches were
    // identical, and rebuilding restarts the CSS animation — so the marquee
    // jerked back to the start once a minute. Repaint only on a real change.
    // Width is part of the key because it decides the repeat count.
    const paintKey = viewport + '|' + chips.join('');
    if (paintKey === lastPaintKey && track.childElementCount) return;
    lastPaintKey = paintKey;

    // Measure one pass, then repeat it until it covers the viewport. Without
    // this a quiet day leaves one chip trailed by a screen-wide empty gap.
    track.style.animation = 'none';
    track.innerHTML = chips.join('');
    const baseWidth = track.scrollWidth;
    const reps = baseWidth > 0 ? Math.max(1, Math.ceil(viewport / baseWidth)) : 1;

    let half = chips.slice();
    for (let i = 1; i < reps; i++) half = half.concat(chips.map(hide));
    track.innerHTML = half.concat(half.map(hide)).join('');

    // Duration scales with width so two chips and twenty scroll at one speed.
    track.style.animation = '';
    track.style.animationDuration = Math.max(12, (track.scrollWidth / 2) / TICKER_SPEED) + 's';

    wireTickerPopups(track);
  }

  function renderTicker(results, fixtures) {
    lastTicker = { results, fixtures };
    paintTicker(tickerEntries(results, fixtures));
  }

  // Repeat count depends on viewport width, so recompute when it changes.
  let tickerResizeTimer;
  window.addEventListener('resize', () => {
    clearTimeout(tickerResizeTimer);
    tickerResizeTimer = setTimeout(() => {
      if (lastTicker) renderTicker(lastTicker.results, lastTicker.fixtures);
    }, 200);
  });

  function tickerPopHtml(r) {
    const mk = (side, label) => {
      const list = (r.scorers || []).filter(s => s.team === side);
      const body = list.length
        ? list.map(s => `${s.name}${s.minute ? " " + s.minute + "'" : ''}`).join('<br>')
        : '<span class="pop-none">Ingen m\u00e5l</span>';
      return `<div class="pop-group"><div class="pop-side">${label}</div>${body}</div>`;
    };
    const comp = r.competitionName ? `<div class="pop-side" style="color:var(--ink-dim);margin-bottom:6px;">${r.competitionName}</div>` : '';
    return `${comp}<div class="pop-match">${r.homeGoals}\u2013${r.awayGoals}</div>${mk('home', r.home)}${mk('away', r.away)}`;
  }

  function showTickerPop(chip) {
    const pop = document.getElementById('tickerPop');
    const r = tickerData[Number(chip.dataset.idx)];
    if (!pop || !r) return;
    pop.innerHTML = tickerPopHtml(r);
    pop.classList.add('show');
    pop.setAttribute('aria-hidden', 'false');

    const rect = chip.getBoundingClientRect();
    const popW = pop.offsetWidth;
    let left = rect.left + window.scrollX + rect.width / 2 - popW / 2;
    // keep it on screen on narrow viewports
    const margin = 10;
    left = Math.max(margin + window.scrollX, Math.min(left, window.scrollX + document.documentElement.clientWidth - popW - margin));
    pop.style.left = left + 'px';
    pop.style.top = (rect.bottom + window.scrollY + 8) + 'px';
  }

  function hideTickerPop() {
    const pop = document.getElementById('tickerPop');
    if (!pop) return;
    pop.classList.remove('show');
    pop.setAttribute('aria-hidden', 'true');
  }

  function wireTickerPopups(track) {
    track.querySelectorAll('.ticker-chip.has-scorers').forEach(chip => {
      chip.addEventListener('mouseenter', () => showTickerPop(chip));
      chip.addEventListener('mouseleave', hideTickerPop);
      chip.addEventListener('focus', () => showTickerPop(chip));
      chip.addEventListener('blur', hideTickerPop);
      chip.addEventListener('click', (e) => {
        e.stopPropagation();
        const pop = document.getElementById('tickerPop');
        if (pop && pop.classList.contains('show')) hideTickerPop();
        else showTickerPop(chip);
      });
      chip.addEventListener('keydown', (e) => { if (e.key === 'Escape') hideTickerPop(); });
    });
  }

  document.addEventListener('click', hideTickerPop);
  window.addEventListener('scroll', hideTickerPop, { passive: true });
  window.addEventListener('resize', hideTickerPop);

  // Team names reach innerHTML straight from the feed, so escape them here.
  function esc(str) {
    return String(str ?? '').replace(/[&<>"']/g, c => (
      { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
    ));
  }

  // The feed gives a status but no elapsed minute, so the badge says which
  // phase the match is in rather than how far into it we are.
  const LIVE_LABEL = { HT: 'PAUSE', BT: 'PAUSE', ET: 'EKSTRAOMG.', P: 'STRAFFER' };
  const DONE_LABEL = { AET: 'E.O.', PEN: 'STR.' };

  function matchTile(m, kind) {
    const live = kind === 'live', done = kind === 'done';
    const when = live
      ? `<span class="live-dot"></span>${LIVE_LABEL[m.status] || 'LIVE'}`
      : done ? (DONE_LABEL[m.status] || 'FT') : fmtTime(m.date);

    const hg = m.homeGoals, ag = m.awayGoals;
    const hasScore = (live || done) && hg != null && ag != null;
    const homeLost = done && hasScore && hg < ag;
    const awayLost = done && hasScore && ag < hg;

    const side = (team, goals, lost) =>
      `<div class="tile-row${lost ? ' lost' : ''}">` +
      `<span class="tile-team" title="${esc(team)}">${esc(team)}</span>` +
      `<span class="tile-score">${hasScore ? goals : ''}</span></div>`;

    return `<div class="tile${live ? ' is-live' : ''}${done ? ' is-done' : ''}">` +
      `<div class="tile-top"><span class="tile-when">${when}</span>` +
      `<span class="tile-comp">${esc(m.competition || 'PL')}</span></div>` +
      side(m.home, hg, homeLost) + side(m.away, ag, awayLost) + `</div>`;
  }

  function renderToday(data) {
    const grid = document.getElementById('todayGrid');
    const tagEl = document.getElementById('todayTag');
    const noteEl = document.getElementById('todayNote');
    if (!grid) return;

    const byTimeAsc = (a, b) => new Date(a.date) - new Date(b.date);
    const played = (data.results || []).filter(r => isToday(r.date));
    const live = played.filter(r => tickerIsLive(r.status)).sort(byTimeAsc);
    const done = played.filter(r => !tickerIsLive(r.status)).sort(byTimeAsc);
    const upcoming = (data.fixtures || []).filter(f => isToday(f.date)).sort(byTimeAsc);

    // In play first, then what is still to come, then what is already settled.
    const tiles = [
      ...live.map(m => matchTile(m, 'live')),
      ...upcoming.map(m => matchTile(m, 'next')),
      ...done.map(m => matchTile(m, 'done')),
    ];

    if (tiles.length) {
      const total = tiles.length;
      tagEl.textContent = live.length ? 'PÅGÅR NÅ' : 'I DAG';
      noteEl.textContent = `${fmtDate(new Date().toISOString())} · ${total} ${total === 1 ? 'kamp' : 'kamper'}`
        + (live.length ? ` · ${live.length} live` : '');
      grid.innerHTML = tiles.join('');
      return;
    }

    // Nothing today — point at the next match rather than showing an empty board.
    const next = (data.fixtures || [])
      .filter(f => new Date(f.date) > new Date())
      .sort(byTimeAsc)[0];

    if (!next) {
      tagEl.textContent = 'INGEN KAMPER';
      noteEl.textContent = '';
      grid.innerHTML = '<div class="today-empty">Ingen kamper er satt opp akkurat nå.</div>';
      return;
    }

    tagEl.textContent = 'NESTE KAMP';
    noteEl.textContent = `${fmtDate(next.date)} · ingen kamper i dag`;
    grid.innerHTML = matchTile(next, 'next');
  }

  let latestData = null;
  let activeFilter = 'liga';
  let activeSub = 'alle';
  let roundIndex = null;   // null = pick the live or next round automatically

  const GROUP_LABELS = {
    liga: 'Premier League',
    cup: 'FA-cupen og Ligacupen',
    europa: 'Europeiske turneringer',
  };

  function matchesFilter(item) {
    const g = item.group || 'liga';
    if (g !== activeFilter) return false;
    if (activeSub !== 'alle' && item.competition !== activeSub) return false;
    return true;
  }

  function renderSubBar() {
    const bar = document.getElementById('subBar');
    if (!bar || !latestData) return;
    const comps = (latestData.competitions || []).filter(c => c.group === activeFilter);

    // Only worth showing when the group actually holds more than one competition.
    if (activeFilter === 'alle' || comps.length < 2) {
      bar.style.display = 'none';
      bar.innerHTML = '';
      activeSub = 'alle';
      return;
    }

    bar.style.display = 'flex';
    // No combined option: a round belongs to one competition, so mixing them
    // into a single sequence made the navigator harder to read, not richer.
    if (!comps.some(c => c.code === activeSub)) activeSub = comps[0].code;
    bar.innerHTML = comps.map(c => {
      const n = (c.teams || []).length;
      const badge = n ? ` <span class="count">${n}</span>` : '';
      const title = n ? ` title="${c.teams.join(', ')}"` : '';
      return `<button class="filter-pill${activeSub === c.code ? ' active' : ''}" role="tab"
        aria-selected="${activeSub === c.code}" data-sub="${c.code}"${title}>${c.name}${badge}</button>`;
    }).join('');

    bar.querySelectorAll('.filter-pill').forEach(btn => {
      btn.addEventListener('click', () => {
        activeSub = btn.dataset.sub;
        roundIndex = null;
        renderSubBar();
        applyFilter();
      });
    });
  }

  function roundKeyOf(m) {
    return (m.competition || 'PL') + '|' + (m.round || '');
  }

  // Rounds are ordered by their earliest kick-off rather than by name. That
  // works for a numbered league matchweek and a cup stage alike, so no
  // hardcoded knockout order is needed.
  function buildRounds(d) {
    const all = [...(d.results || []), ...(d.fixtures || [])].filter(matchesFilter);
    const map = new Map();
    for (const m of all) {
      const key = roundKeyOf(m);
      if (!map.has(key)) {
        map.set(key, { key, competition: m.competition, competitionName: m.competitionName, round: m.round, matches: [] });
      }
      map.get(key).matches.push(m);
    }
    const rounds = [...map.values()];
    for (const r of rounds) {
      r.matches.sort((a, b) => new Date(a.date) - new Date(b.date));
      r.start = new Date(r.matches[0].date).getTime();
      r.end = new Date(r.matches[r.matches.length - 1].date).getTime();
    }
    rounds.sort((a, b) => a.start - b.start);
    return rounds;
  }

  // A round stays current while it runs and for three hours after its last
  // kick-off, so the view does not jump ahead in the middle of a Sunday.
  function defaultRoundIndex(rounds) {
    const now = Date.now();
    let i = rounds.findIndex(r => now >= r.start && now <= r.end + 3 * 60 * 60 * 1000);
    if (i !== -1) return i;
    i = rounds.findIndex(r => r.start > now);
    if (i !== -1) return i;
    return Math.max(0, rounds.length - 1);
  }

  function matchRowHtml(m, showComp) {
    const live = tickerIsLive(m.status);
    const played = live || m.homeGoals != null;
    const hasScorers = (m.scorers || []).length > 0;
    const mid = played ? `${m.homeGoals ?? '\u2013'}\u2013${m.awayGoals ?? '\u2013'}` : fmtTime(m.date);
    const tag = live
      ? `<span class="match-tag live">${LIVE_LABEL[m.status] || 'LIVE'}</span>`
      : played ? `<span class="match-tag">${DONE_LABEL[m.status] || 'FT'}</span>` : '';
    return `<div class="match-row${hasScorers ? ' has-scorers' : ''}"${hasScorers ? ' tabindex="0"' : ''}>` +
      (showComp ? `<div class="match-comp">${esc(m.competitionName || '')}${m.round ? ' \u00b7 ' + esc(m.round) : ''}</div>` : '') +
      `<span class="match-side">${esc(m.home)}</span>` +
      `<span class="match-mid${played ? '' : ' upcoming'}">${mid}${tag}</span>` +
      `<span class="match-side away">${esc(m.away)}</span>` +
      (hasScorers ? scorerPopHtml(m) : '') + `</div>`;
  }

  function renderRound(rounds, idx) {
    const nav = document.getElementById('roundNav');
    const host = document.getElementById('roundMatches');
    if (!host) return;

    if (!rounds.length) {
      if (nav) nav.style.display = 'none';
      host.innerHTML = '<div class="empty-note">Ingen kamper i denne kategorien enn\u00e5.</div>';
      return;
    }
    if (nav) nav.style.display = 'flex';

    const r = rounds[idx];
    // One competition needs no per-row label; "begge cuper" and the European
    // view can mix competitions, so there each row repeats its own.
    const single = new Set(rounds.map(x => x.competition)).size === 1;
    document.getElementById('roundName').textContent =
      single ? (r.round || r.competitionName || '') : `${r.competitionName || ''} \u00b7 ${r.round || ''}`;

    const first = fmtDate(r.matches[0].date);
    const last = fmtDate(r.matches[r.matches.length - 1].date);
    document.getElementById('roundDates').textContent = first === last ? first : `${first} \u2013 ${last}`;

    const prev = document.getElementById('roundPrev');
    const next = document.getElementById('roundNext');
    if (prev) prev.disabled = idx <= 0;
    if (next) next.disabled = idx >= rounds.length - 1;

    const days = new Map();
    for (const m of r.matches) {
      const d = fmtDate(m.date);
      if (!days.has(d)) days.set(d, []);
      days.get(d).push(m);
    }
    host.innerHTML = [...days.entries()].map(([label, list]) =>
      `<div class="round-day"><div class="round-day-label">${label}</div>` +
      list.map(m => matchRowHtml(m, !single)).join('') + `</div>`
    ).join('');

    wireScorerPopups(host);
  }

  function applyFilter() {
    if (!latestData) return;
    const d = latestData;

    const rounds = buildRounds(d);
    if (roundIndex === null || roundIndex < 0 || roundIndex >= rounds.length) {
      roundIndex = defaultRoundIndex(rounds);
    }
    renderRound(rounds, roundIndex);


    const counts = { liga: 0, cup: 0, europa: 0 };
    [...(d.results || []), ...(d.fixtures || [])].forEach(m => {
      const g = m.group || 'liga';
      if (counts[g] !== undefined) counts[g]++;
    });
    document.querySelectorAll('.filter-bar:not(.sub-bar) .filter-pill').forEach(btn => {
      const f = btn.dataset.filter;
      const base = btn.textContent.replace(/\s*\d+$/, '').trim();
      btn.innerHTML = base + (counts[f] ? ` <span class="count">${counts[f]}</span>` : '');
    });

    const note = document.getElementById('kamperNote');
    if (note) {
      const comp = (d.competitions || []).find(c => c.code === activeSub);
      if (comp && (comp.teams || []).length) {
        note.textContent = `${comp.name} \u00b7 engelske lag: ${comp.teams.join(', ')}`;
      } else if (comp) {
        note.textContent = `${comp.name} \u00b7 ingen engelske lag med i \u00e5r`;
      } else {
        note.textContent = GROUP_LABELS[activeFilter];
      }
    }
  }

  function stepRound(delta) {
    const rounds = buildRounds(latestData || {});
    const base = roundIndex === null ? defaultRoundIndex(rounds) : roundIndex;
    const next = base + delta;
    if (next < 0 || next >= rounds.length) return;
    roundIndex = next;
    renderRound(rounds, roundIndex);
  }

  document.getElementById('roundPrev').addEventListener('click', () => stepRound(-1));
  document.getElementById('roundNext').addEventListener('click', () => stepRound(1));

  document.querySelectorAll('.filter-bar:not(.sub-bar) .filter-pill').forEach(btn => {
    btn.addEventListener('click', () => {
      activeFilter = btn.dataset.filter;
      activeSub = 'alle';
      roundIndex = null;
      document.querySelectorAll('.filter-bar:not(.sub-bar) .filter-pill').forEach(b => {
        const on = b === btn;
        b.classList.toggle('active', on);
        b.setAttribute('aria-selected', on ? 'true' : 'false');
      });
      renderSubBar();
      applyFilter();
    });
  });

  // Theme toggle. The initial value is set by the inline script in <head>
  // so the page never flashes the wrong colours on load.
  const themeBtn = document.getElementById('themeToggle');
  if (themeBtn) {
    themeBtn.addEventListener('click', () => {
      const current = document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
      const next = current === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      try { localStorage.setItem('balloya-theme', next); } catch (e) {}
    });
  }

  // Follow the operating system if the reader hasn't picked a side themselves.
  if (window.matchMedia) {
    const mq = window.matchMedia('(prefers-color-scheme: dark)');
    const onSystemChange = (e) => {
      let saved = null;
      try { saved = localStorage.getItem('balloya-theme'); } catch (err) {}
      if (!saved) document.documentElement.setAttribute('data-theme', e.matches ? 'dark' : 'light');
    };
    if (mq.addEventListener) mq.addEventListener('change', onSystemChange);
    else if (mq.addListener) mq.addListener(onSystemChange);
  }

  async function refreshLiveData() {
    const statusEl = document.getElementById('liveStatus');
    try {
      // The version tag gives us a fresh cache key whenever the backend changes,
      // so a bad cached response can never outlive a deploy. Bump it on backend edits.
      const res = await fetch('/api/live-data?v=6');
      const data = await res.json();
      if (data.error) throw new Error(data.error);
      latestData = data;

      renderTables(data);
      renderSubBar();
      applyFilter();
      renderTicker(data.results || [], data.fixtures || []);
      renderToday(data);

      if (statusEl) statusEl.textContent = 'oppdatert ' + fmtTime(data.updated || new Date().toISOString());
    } catch (e) {
      if (statusEl) statusEl.textContent = 'viser siste lagrede data';
    }
  }

  refreshLiveData();
  setInterval(refreshLiveData, 60 * 1000);

</script>

</body>
</html>
